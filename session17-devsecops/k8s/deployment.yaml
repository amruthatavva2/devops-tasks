apiVersion: apps/v1
kind: Deployment
metadata: {name: devsecops-demo}
spec:
  replicas: 2
  selector: {matchLabels: {app: devsecops-demo}}
  template:
    metadata: {labels: {app: devsecops-demo}}
    spec:
      containers:
        - name: app
          image: ghcr.io/OWNER/devsecops-demo:latest
          ports: [{containerPort: 3000}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 128Mi}}
