apiVersion: apps/v1
kind: Deployment
metadata: {name: hpa-demo, labels: {app: hpa-demo}}
spec:
  replicas: 1
  selector: {matchLabels: {app: hpa-demo}}
  template:
    metadata: {labels: {app: hpa-demo}}
    spec:
      containers:
        - name: php-apache
          image: registry.k8s.io/hpa-example
          ports: [{containerPort: 80}]
          resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {cpu: 500m, memory: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: hpa-demo}
spec: {selector: {app: hpa-demo}, ports: [{port: 80, targetPort: 80}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: hpa-demo}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: hpa-demo}
  minReplicas: 1
  maxReplicas: 5
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 50}}}]
