apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "webapp.fullname" . }}, labels: {app.kubernetes.io/name: {{ include "webapp.name" . }}}}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app.kubernetes.io/name: {{ include "webapp.name" . }}}}
  template:
    metadata: {labels: {app.kubernetes.io/name: {{ include "webapp.name" . }}}}
    spec:
      containers:
        - name: webapp
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{containerPort: 80}]
          resources: {{- toYaml .Values.resources | nindent 12 }}
