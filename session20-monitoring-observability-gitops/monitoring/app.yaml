apiVersion: apps/v1
kind: Deployment
metadata: {name: observability-demo, labels: {app: observability-demo}}
spec:
  replicas: 2
  selector: {matchLabels: {app: observability-demo}}
  template:
    metadata: {labels: {app: observability-demo}}
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}
          readinessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: observability-demo}
spec: {selector: {app: observability-demo}, ports: [{port: 80, targetPort: 80}]}
