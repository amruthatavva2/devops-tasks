apiVersion: apps/v1
kind: Deployment
metadata: {name: yatri-frontend, labels: {app: yatri-app}}
spec:
  replicas: 2
  selector: {matchLabels: {app: yatri-frontend}}
  template:
    metadata: {labels: {app: yatri-frontend, app-group: yatri-app}}
    spec: {containers: [{name: frontend, image: nginx:1.27-alpine, ports: [{containerPort: 80}]}]}
---
apiVersion: v1
kind: Service
metadata: {name: yatri-frontend, labels: {app: yatri-app}}
spec: {selector: {app: yatri-frontend}, ports: [{port: 80, targetPort: 80}]}
