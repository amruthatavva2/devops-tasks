name: ProjectPulse CI/CD
on:
  push:
    branches: [main]
    paths: ["session21-devops-capstone-final/**", ".github/workflows/session21-projectpulse.yml"]
  pull_request:
    paths: ["session21-devops-capstone-final/**", ".github/workflows/session21-projectpulse.yml"]
permissions: { contents: read, packages: write }
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: session21-devops-capstone-final } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt && pytest backend/tests -v
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: session21-devops-capstone-final/frontend/package-lock.json }
      - run: cd frontend && npm ci && npm run build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: session21-devops-capstone-final/backend, push: false, tags: projectpulse-backend:${{ github.sha }}, load: true }
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: projectpulse-backend:${{ github.sha }}, format: table, exit-code: "1", ignore-unfixed: true, severity: HIGH,CRITICAL }
      - uses: docker/build-push-action@v6
        with: { context: session21-devops-capstone-final/frontend, push: false, tags: projectpulse-frontend:${{ github.sha }}, load: true }
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: projectpulse-frontend:${{ github.sha }}, format: table, exit-code: "1", ignore-unfixed: true, severity: HIGH,CRITICAL }
  publish-ghcr:
    if: github.event_name == 'push'
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - uses: docker/build-push-action@v6
        with: { context: session21-devops-capstone-final/backend, push: true, tags: ghcr.io/${{ github.repository_owner }}/projectpulse-backend:${{ github.sha }} }
      - uses: docker/build-push-action@v6
        with: { context: session21-devops-capstone-final/frontend, push: true, tags: ghcr.io/${{ github.repository_owner }}/projectpulse-frontend:${{ github.sha }} }
