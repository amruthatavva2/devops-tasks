services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: projectpulse
      POSTGRES_USER: projectpulse
      POSTGRES_PASSWORD: projectpulse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectpulse -d projectpulse"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [postgres-data:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://projectpulse:projectpulse@postgres:5432/projectpulse
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:8080"]
volumes:
  postgres-data:
