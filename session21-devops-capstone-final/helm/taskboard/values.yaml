images:
  frontend: projectpulse-frontend:local
  backend: projectpulse-backend:local
  pullPolicy: IfNotPresent
replicas:
  frontend: 2
  backend: 2
postgres:
  image: postgres:16-alpine
  storage: 1Gi
  password: projectpulse
ingress:
  enabled: false
  host: taskboard.local
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  cpu: 70
serviceMonitor:
  enabled: false
