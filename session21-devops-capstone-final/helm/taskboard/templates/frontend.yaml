apiVersion: apps/v1
kind: Deployment
metadata: { name: projectpulse-frontend }
spec:
  replicas: {{ .Values.replicas.frontend }}
  selector: { matchLabels: { app: projectpulse-frontend } }
  template:
    metadata: { labels: { app: projectpulse-frontend } }
    spec:
      containers:
        - name: frontend
          image: {{ .Values.images.frontend }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports: [{ containerPort: 8080 }]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 200m, memory: 128Mi } }
          livenessProbe: { httpGet: { path: /, port: 8080 }, initialDelaySeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: frontend }
spec: { selector: { app: projectpulse-frontend }, ports: [{ port: 80, targetPort: 8080 }] }
