apiVersion: apps/v1
kind: Deployment
metadata: {name: app-recreate}
spec:
  replicas: 3
  strategy: {type: Recreate}
  selector: {matchLabels: {app: app-recreate}}
  template:
    metadata: {labels: {app: app-recreate}}
    spec: {containers: [{name: app, image: hashicorp/http-echo:1.0, args: ['-text=VERSION: v2 (UPGRADED)'], ports: [{containerPort: 5678}]}]}
