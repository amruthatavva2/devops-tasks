apiVersion: v1
kind: Pod
metadata: {name: lifecycle-init}
spec:
  initContainers:
    - name: prepare
      image: busybox:1.36
      command: ['sh','-c','echo ready > /work/message']
      volumeMounts: [{name: work, mountPath: /work}]
  containers:
    - name: app
      image: busybox:1.36
      command: ['sh','-c','cat /work/message; sleep 3600']
      volumeMounts: [{name: work, mountPath: /work}]
  volumes: [{name: work, emptyDir: {}}]
