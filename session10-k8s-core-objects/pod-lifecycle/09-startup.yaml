apiVersion: v1
kind: Pod
metadata: {name: lifecycle-startup}
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ['sh','-c','sleep 20; touch /tmp/started; sleep 3600']
      startupProbe: {exec: {command: ['sh','-c','test -f /tmp/started']}, failureThreshold: 10, periodSeconds: 3}
      livenessProbe: {exec: {command: ['sh','-c','test -f /tmp/started']}, periodSeconds: 5}
