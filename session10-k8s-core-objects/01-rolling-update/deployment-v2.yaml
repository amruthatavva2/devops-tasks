apiVersion: apps/v1
kind: Deployment
metadata: {name: app-rolling}
spec:
  replicas: 3
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  selector: {matchLabels: {app: app-rolling}}
  template:
    metadata: {labels: {app: app-rolling, version: v2}}
    spec: {containers: [{name: app, image: nginx:1.27.4-alpine, ports: [{containerPort: 80}]}]}
