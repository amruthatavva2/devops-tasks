apiVersion: apps/v1
kind: Deployment
metadata: {name: app-stable}
spec:
  replicas: 9
  selector: {matchLabels: {app: myapp-canary, track: stable}}
  template:
    metadata: {labels: {app: myapp-canary, track: stable}}
    spec: {containers: [{name: app, image: hashicorp/http-echo:1.0, args: ['-text=STABLE v1'], ports: [{containerPort: 5678}]}]}
